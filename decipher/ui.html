<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decipher</title>
<style>
/* Calm layered surfaces in the style of Realm: page < canvas < surface < raised.
   Hairlines instead of borders, one blue accent, green/orange only for status. */
:root{
  color-scheme:light;
  --page:#ececea;--canvas:#f7f7f6;--surface:#ffffff;--raised:#ececea;--raised-2:#e2e2df;--inset:#ffffff;
  --ink:#1b1c1e;--ink-2:#5d6066;--ink-3:#65686f;--line:#0000000f;--line-strong:#0000001c;
  --accent:#0a6fd6;--accent-ink:#0a5cb5;--accent-fill:#006fcf;--accent-soft:#0a6fd614;
  --green:#1f9d57;--green-ink:#167444;--green-soft:#1f9d5717;--orange:#d9711c;--orange-ink:#a9530e;--orange-soft:#d9711c17;--red:#d6454a;
  --shadow:0 1px 2px #0000000a,0 8px 24px #0000000a;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#17181a;--canvas:#1c1d1f;--surface:#232427;--raised:#2a2b2e;--raised-2:#313236;--inset:#1f2022;
  --ink:#f2f3f4;--ink-2:#a5a8ad;--ink-3:#8b8e94;--line:#ffffff14;--line-strong:#ffffff1f;
  --accent:#3d9aff;--accent-ink:#7ec0ff;--accent-fill:#006fcf;--accent-soft:#3d9aff1f;
  --green:#3cbb72;--green-ink:#3cbb72;--green-soft:#3cbb721f;--orange:#f68f3c;--orange-ink:#f68f3c;--orange-soft:#f68f3c1f;--red:#ee5c61;
  --shadow:0 1px 0 #ffffff08 inset,0 10px 30px #00000040;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a,a:visited{color:inherit;text-decoration:none}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.ink2{color:var(--ink-2)}.ink3{color:var(--ink-3)}.sm{font-size:13px}.xs{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:transparent;border-radius:12px;padding:8px 14px;font-weight:550;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--raised)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent-fill);border-color:transparent;color:#fff}
.btn.primary:hover{background:#0063bd}
a.btn.primary,a.btn.primary:visited{color:#fff}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--red)}
.btn svg{width:16px;height:16px}
.text-btn{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.text-btn:hover{color:var(--ink)}
input,select,textarea{border:1px solid var(--line-strong);background:var(--inset);border-radius:10px;padding:9px 12px;max-width:100%}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{width:100%;min-height:84px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;font-weight:550;font-size:13.5px}
.field small{font-weight:400;color:var(--ink-2)}
.field input,.field textarea{font-weight:400;font-size:15px}
.kbd{font:500 11.5px var(--mono);border:1px solid var(--line-strong);border-radius:6px;padding:1px 6px;color:var(--ink-2)}

/* Status rings (Realm's orange "needs you" / green "done") */
.ring{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;display:inline-grid;place-items:center;flex:none}
.ring::after{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:currentColor}
.c-known,.c-reviewed{color:var(--green)}.c-pattern{color:var(--accent)}.c-guess,.c-waiting{color:var(--orange)}.c-none{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:550;font-size:13px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}.pill.blue{background:var(--accent-soft);color:var(--accent-ink)}.pill.orange{background:var(--orange-soft);color:var(--orange)}.pill.gray{background:var(--raised);color:var(--ink-2)}
.pill svg{width:14px;height:14px}

/* Shell: icon rail · sidebar · canvas */
.app{display:grid;grid-template-columns:56px 268px minmax(0,1fr);height:100vh}
.app.collapsed{grid-template-columns:56px minmax(0,1fr)}
.app.collapsed .sidebar{display:none}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rail a,.rail button{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);border:0;background:none;cursor:pointer}
.rail a:hover,.rail button:hover{background:var(--raised);color:var(--ink)}
.rail [aria-current="page"]{background:var(--raised);color:var(--ink)}
.rail .brand{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--page);font:800 14px var(--font);margin-bottom:10px}
.rail .grow{flex:1}
.sidebar{padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column}
.ws{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;font-weight:650;font-size:16px}
.ws svg{color:var(--ink-2)}
.sec{display:flex;align-items:center;justify-content:space-between;color:var(--ink-3);font-weight:500;padding:14px 10px 6px;font-size:14px}
.sec button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:2px;border-radius:6px;display:grid}
.sec button:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:11px;color:var(--ink-2);cursor:pointer;min-width:0;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--raised);color:var(--ink)}
.row[aria-current="page"]{background:var(--raised);color:var(--ink)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.row .n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row.space{color:var(--ink);font-weight:550}
.row .chev{width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
.row.open .chev{transform:rotate(90deg)}
.row.child{padding-left:44px;font-size:14.5px}
.glyph{width:20px;height:20px;border-radius:6px;border:1.8px solid currentColor;display:grid;place-items:center;font:700 9.5px var(--font);flex:none}
.sb-foot{margin-top:auto;padding-top:14px}
.canvas{background:var(--canvas);border-left:1px solid var(--line);border-top:1px solid var(--line);border-top-left-radius:16px;margin-top:8px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);min-height:52px}
.topbar .nav-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;border:0;background:none;color:var(--ink-3);cursor:pointer}
.topbar .nav-btn:hover{background:var(--raised);color:var(--ink)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;margin-left:6px;font-size:15px}
.crumbs a{color:var(--ink-2)}.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-3)}
.crumbs .cur{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.scroll{flex:1;overflow-y:auto}
.page{max-width:1120px;margin:0 auto;padding:40px 40px 96px}
.page.wide{max-width:none;padding:0}

/* Typography & blocks */
h1{font-size:34px;font-weight:650;letter-spacing:-.025em;margin:0;line-height:1.15}
h2{font-size:17px;font-weight:600;margin:0}
.lead{color:var(--ink-2);margin:10px 0 0;max-width:68ch;font-size:16px}
.meta-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:15px;margin-bottom:14px}
.summary-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);margin:16px 0 0}
.summary-line .s{color:var(--ink-3)}
.summary-line b{color:var(--ink);font-weight:550}
.card{background:var(--surface);border-radius:18px;padding:22px 24px}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head .n{color:var(--ink-3)}
.gap{height:28px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 24px;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .t{flex:1;min-width:0}
.list-row .t .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .t .b{color:var(--ink-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row.click{cursor:pointer}.list-row.click:hover{background:var(--raised)}
.finding{background:var(--surface);border-radius:16px;padding:16px 20px}
.finding+.finding{margin-top:10px}
.finding .head{display:flex;align-items:center;gap:10px}
.finding .head .t{flex:1;font-weight:550}
.finding p{margin:6px 0 0;color:var(--ink-2)}
.big{font-size:56px;font-weight:650;letter-spacing:-.035em;line-height:1}
.track{height:4px;border-radius:3px;background:var(--raised-2);overflow:hidden}
.track>i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.track.green>i{background:var(--green)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:600;letter-spacing:-.01em}
.stat span{color:var(--ink-3);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:22px}
.empty{padding:40px 24px;text-align:center;color:var(--ink-2)}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:13px;padding:12px 20px;border-bottom:1px solid var(--line)}
td{padding:14px 20px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.affix{font:600 15px var(--mono);color:var(--accent-ink)}
.form{display:inline-flex;gap:6px;align-items:baseline;margin:2px 12px 2px 0}
.form .g{font-size:13px;color:var(--ink-3)}
.code{font:13px var(--mono);background:var(--raised);border-radius:6px;padding:1px 6px}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;flex:none}

/* Review session: work pane + inspector */
.session{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:100%}
.work{padding:28px 40px 80px;min-width:0}
.inspector{border-left:1px solid var(--line);padding:24px 24px 60px;background:var(--canvas)}
.chips{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.chip-f{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:999px;padding:5px 10px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13.5px}
.chip-f:hover{background:var(--raised)}
.chip-f[aria-pressed="true"]{background:var(--raised-2);color:var(--ink)}
.chip-f .n{color:var(--ink-3);font-variant-numeric:tabular-nums}
.searchbox{width:220px;padding:6px 12px;border-radius:999px;font-size:14px}
.saved-else{background:var(--green-soft);border-radius:12px;padding:10px 12px;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.saved-else .opt{display:flex;align-items:center;gap:8px}
.saved-else .opt .g{font-size:15px;flex:1}
.turn{display:flex;align-items:center;gap:8px;color:var(--ink-2);margin:20px 0 10px;font-size:14.5px;min-width:0;white-space:nowrap}
.turn .q{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--ink-3)}
.turn .s{color:var(--ink-3)}
.turn .plus{color:var(--green);font-family:var(--mono);font-size:13.5px}
.changed{background:var(--surface);border-radius:16px;padding:16px 20px;margin-bottom:26px}
.changed .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.changed .head b{font-weight:550}
.changed .item{display:flex;gap:12px;align-items:baseline;padding:6px 0;cursor:pointer;color:var(--ink-2)}
.changed .item:hover{color:var(--ink)}
.changed .item .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.changed .item .d{font-size:13.5px;color:var(--green);white-space:nowrap}
.where{display:flex;align-items:center;gap:10px;color:var(--ink-3);font:13px var(--mono);margin:22px 0 18px}
/* Interlinear glossed text: each source word sits directly above its gloss, in reading order. */
.igt{display:flex;flex-wrap:wrap;gap:22px 8px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:6px;padding:8px 8px 6px;border-radius:12px;cursor:text;transition:background .15s;min-width:0}
.col:hover{background:var(--surface)}
.col.focus{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.col .src{font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.2;white-space:nowrap;color:var(--ink)}
.col input{font:14.5px var(--mono);border:0;border-radius:6px;background:transparent;padding:3px 4px;margin:0 -4px;min-width:5ch;max-width:30ch;color:var(--ink)}
.col input:focus{outline:none;background:var(--inset)}
.col .bar{height:3px;border-radius:2px;background:currentColor;opacity:.85}
.col .lbl{font-size:11.5px;font-weight:600;letter-spacing:.02em;line-height:1;height:12px;color:var(--orange-ink)}
.col.s-none .lbl{color:var(--ink-2)}.col.edited .lbl{color:var(--accent-ink)}
.col.s-known,.col.s-reviewed{color:var(--green)}.col.s-pattern{color:var(--accent)}.col.s-guess{color:var(--orange)}.col.s-none{color:var(--ink-3)}
.col.s-known .bar,.col.s-reviewed .bar,.col.s-pattern .bar{opacity:.45}
.col.flag{color:var(--orange)}.col.flag .bar{opacity:1}
.col.edited{color:var(--accent)}.col.edited .bar{opacity:1}
.checkbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 18px;font-size:14px;color:var(--ink-2)}
.checkbar b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:currentColor;display:inline-block}
.queue-select{border-radius:999px;padding:5px 30px 5px 12px;font-size:13.5px;font-weight:550;background:var(--surface)}
.actionbar{position:sticky;bottom:0;z-index:5;margin:28px -40px 0;padding:14px 40px;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:20px}
.actionbar .prog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.actionbar .prog .track{width:150px}
.actionbar .keys{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
@media(max-width:1240px) and (min-width:1181px){.actionbar .keys{display:none}}
.actionbar .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.whole{margin-top:22px;color:var(--ink-2);font-size:13.5px}
.whole summary{cursor:pointer;width:max-content}
.whole input{width:100%;margin-top:10px;font:15px var(--mono)}
/* Leipzig convention: grammatical tags in small capitals; hover a tag for its meaning. */
.gl{font-family:var(--font);letter-spacing:.01em}
.gl .sc{font-variant-caps:all-small-caps;letter-spacing:.06em;font-weight:600}
.gl abbr.sc{text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px;cursor:help}
.tagdict{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 24px;margin-top:10px}
.tagdict div{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);min-width:0}
.tagdict .tg{min-width:64px;font-size:15px}
.tagdict .m{color:var(--ink)}
.tagdict .hint{color:var(--ink-3);font-size:12.5px}
.unusual{background:var(--orange-soft);border-radius:12px;padding:10px 12px;margin-top:16px}
.unusual b{color:var(--orange-ink);font-weight:600}
.unusual p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.local{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:500;padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;white-space:nowrap;margin-left:4px}
.local svg{width:14px;height:14px}
.consent{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:550;white-space:nowrap;vertical-align:middle}
.consent svg{width:14px;height:14px}
.consent.ok{color:var(--green-ink)}.consent.missing{color:var(--orange-ink)}
a.consent:hover{text-decoration:underline}
.pilot .big{font-size:44px}
.pilot .lbl{color:var(--ink-2);font-size:14px;font-weight:550;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pilot p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.pilot .note{color:var(--ink-3);font-size:12.5px;margin-top:12px}
.pilot .secs{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--ink-2)}
.pilot .secs input{width:72px;padding:5px 8px}
.pilot .langs{margin-top:12px;display:flex;flex-direction:column}
.pilot .langs a,.pilot .langs div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.pilot .langs a:hover{color:var(--accent-ink)}
.next-up{margin-top:34px}
.next-up h3{font-size:14px;font-weight:500;color:var(--ink-3);margin:0 0 8px}
.ins-label{color:var(--ink-3);font-size:13px;font-weight:500;margin:22px 0 8px}
.ins-word{font-size:26px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere}
.cand{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.cand:hover{background:var(--raised)}
.cand .g{font-size:15px;flex:1}
.cand .k{font-size:12px;color:var(--ink-3)}
.conc{padding:8px 10px;border-radius:10px;cursor:pointer}
.conc:hover{background:var(--raised)}
.conc .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conc .g{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
mark{background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:0 2px}

/* Charts */
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font:11.5px var(--font);font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:7px 11px;box-shadow:var(--shadow);font-size:13px;z-index:30}
.tip b{font-size:15px}
.bar-row{display:grid;grid-template-columns:14px 1fr auto 56px;gap:10px;align-items:center;padding:10px 0}
.bar-row .track{grid-column:2/5}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--raised)}tr.pick[aria-selected="true"] td{background:var(--raised)}
.seg{display:inline-flex;gap:2px;background:var(--raised);border-radius:11px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:4px 11px;cursor:pointer;color:var(--ink-2);font-weight:550;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

#message{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,90vw);background:var(--raised-2);color:var(--ink);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow);z-index:40;font-weight:500}
#message:empty{display:none}
@media(max-width:1180px){.session{grid-template-columns:minmax(0,1fr)}.inspector{border-left:0;border-top:1px solid var(--line)}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){#t-back,#t-fwd{display:none}}

  ANT: 'anterior', AOR: 'aorist', ATTR: 'attributive', CMPR: 'comparative', SPRL: 'superlative', CNTR: 'contrastive', CND: 'conditional',

function aggregate(rows) {
  const sum = key => rows.reduce((t, r) => t + r.performance.counts[key], 0);
  const kinds = {};
  for (const k of ['known', 'pattern', 'guess', 'none']) kinds[k] = rows.reduce((t, r) => ({words: t.words + r.performance.by_kind[k].words, right: t.right + r.performance.by_kind[k].right}), {words: 0, right: 0});
  return {words: sum('words'), accepted: sum('accepted'), picked: sum('picked'), sentences: sum('sentences'), kinds,
    rate: k => kinds[k].words ? kinds[k].right / kinds[k].words : null, teach: sum('repeat_words') ? sum('repeat_accepted') / sum('repeat_words') : null};
}

    h('p', {class: 'ink3 xs', style: 'margin-top:16px;max-width:90ch'}, 'Imported glosses are replayed too, in file order, as if they had been reviewed one by one. Scoring is exact: a different but acceptable gloss counts as wrong, so these rates are conservative. Later revisions of a sentence are applied but not scored. Rates describe this workspace’s data only; they are not probabilities and not a promise for other text.'));
  drawCurve(); drawTable();
}

// ---------- pilot report: what a pilot measures (time saved, errors caught, permission) ----------
const SECONDS_KEY = 'decipher-seconds-per-gloss';
const GOVERNANCE = ['owner', 'license', 'consent', 'provenance', 'retention', 'conventions'];
const duration = hours => hours < 1 ? `${Math.round(hours * 60)} min` : `${hours.toFixed(hours < 10 ? 1 : 0)} h`;
function pilotNumbers(row, seconds) {
  const p = row.performance, c = p.counts, noTyping = c.accepted + c.picked;
  return {words: c.words, accepted: c.accepted, picked: c.picked, noTyping, hours: noTyping * seconds / 3600,
    fixed: p.revisions.glosses, fixedSentences: p.revisions.sentences, unusual: row.unusual.count, kept: row.unusual.kept};
}
function pilotReport(all) {
  let seconds = Number(localStorage.getItem(SECONDS_KEY)) || 5;
  const totals = () => all.reduce((t, row) => { const x = pilotNumbers(row, seconds); for (const k in x) t[k] = (t[k] || 0) + x[k]; return t; }, {});
  const t = totals(), big = h('div', {class: 'big'}), detail = h('p');
  const drawTime = () => { const now = totals(); big.textContent = `≈ ${duration(now.hours)}`;
    detail.textContent = `${n(now.noTyping)} of ${n(now.words)} glosses needed no typing: ${n(now.accepted)} right as suggested, ${n(now.picked)} picked from the options.`; };
  const secondsInput = h('input', {type: 'number', min: 1, max: 600, step: 1, value: seconds, oninput: e => {
    const value = Number(e.target.value); if (value >= 1 && value <= 600) { seconds = value; localStorage.setItem(SECONDS_KEY, String(value)); drawTime(); } }});
  drawTime();
  const flagged = all.filter(row => row.unusual.count), consented = all.filter(row => row.policy_recorded.includes('consent')).length;
  const href = (row, page) => `#/l/${encodeURIComponent(row.project_id)}/${page}`;
  return h('section', {class: 'pilot'},
    h('div', {class: 'card-head', style: 'align-items:flex-end'},
      h('div', {}, h('h2', 'Pilot report'), h('p', {class: 'ink2 sm', style: 'margin:4px 0 0'}, 'What a pilot reports: time saved, errors caught, and permission to use the data.')),
      h('button', {class: 'btn', type: 'button', onclick: () => downloadPilot(all, seconds)}, icon('download'), 'Download CSV')),
    h('div', {class: 'grid3'},
      h('section', {class: 'card'}, h('div', {class: 'lbl'}, icon('clock'), 'Time saved (estimate)'), big, detail,
        h('label', {class: 'secs'}, 'Seconds to type one gloss by hand', secondsInput),
        h('p', {class: 'note'}, 'Estimated by replaying your saved glosses. During the pilot, time a sample of sentences with and without suggestions to measure it.')),
      h('section', {class: 'card'}, h('div', {class: 'lbl'}, icon('check'), 'Errors caught'), h('div', {class: 'big'}, n(t.fixed)),
        h('p', t.fixed ? `${t.fixed === 1 ? 'gloss' : 'glosses'} corrected after their first save, in ${plural(t.fixedSentences, 'sentence')}.` : 'No saved glosses corrected yet.'),
        h('p', `${plural(t.unusual, 'unusual gloss', 'unusual glosses')} waiting to be checked${t.kept ? `; ${n(t.kept)} checked and kept` : ''}.`),
        flagged.length ? h('div', {class: 'langs'}, flagged.map(row => h('a', {href: href(row, 'review'), onclick: () => { state.jump = {project: row.project_id, filter: 'unusual'}; }},
          h('span', `Check ${row.name}`), h('span', {class: 'ink3'}, `${n(row.unusual.count)} ›`)))) : null,
        h('p', {class: 'note'}, 'Unusual: a word saved with a different gloss from its usual one, a common sign of a slip. Fixing one counts as a correction.')),
      h('section', {class: 'card'}, h('div', {class: 'lbl'}, icon('lock'), 'Permission & data'), h('div', {class: 'big'}, `${consented} of ${all.length}`),
        h('p', `${all.length === 1 ? 'language has' : 'languages have'} consent recorded.`),
        h('div', {class: 'langs'}, all.map(row => h('a', {href: href(row, 'settings'), title: row.policy_recorded.length ? `Recorded: ${row.policy_recorded.join(', ')}` : 'Nothing recorded yet'},
          h('span', row.name), consentBadge(row.policy_recorded)))),
        h('p', {class: 'note'}, 'Everything stays on this computer; nothing is uploaded. Policy notes travel with each language’s backup.'))));
}
function downloadPilot(all, seconds) {
  // Quote CSV cells, and keep spreadsheet apps from reading names as formulas.
  const cell = value => { let text = String(value); if (typeof value === 'string' && /^[=+\-@]/.test(text)) text = `'${text}`; return /[",\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text; };
  const header = ['language', 'code', 'sentences', 'reviewed', 'glosses_replayed', 'right_as_suggested', 'picked_from_options', 'no_typing',
    'seconds_per_gloss_assumed', 'estimated_hours_saved', 'glosses_corrected_after_first_save', 'sentences_corrected',
    'unusual_glosses_to_check', 'unusual_glosses_kept', ...GOVERNANCE.map(field => `${field}_recorded`)];
  const lines = all.map(row => { const x = pilotNumbers(row, seconds);
    return [row.name, row.language_id, row.sentences, row.reviewed, x.words, x.accepted, x.picked, x.noTyping, seconds, x.hours.toFixed(2),
      x.fixed, x.fixedSentences, x.unusual, x.kept, ...GOVERNANCE.map(field => row.policy_recorded.includes(field) ? 'yes' : 'no')]; });
  const url = URL.createObjectURL(new Blob([[header, ...lines].map(line => line.map(cell).join(',')).join('\n') + '\n'], {type: 'text/csv'}));
  const a = h('a', {href: url, download: 'decipher-pilot-report.csv'}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

route();
</script>
