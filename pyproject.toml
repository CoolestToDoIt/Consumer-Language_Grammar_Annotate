[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decipher-commercial"
version = "0.1.0"
description = "Local human-guided word-gloss annotation workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
decipher = "decipher.app:main"

[tool.setuptools.packages.find]
include = ["decipher*"]

[tool.setuptools.package-data]
decipher = ["demo.tsv"]
